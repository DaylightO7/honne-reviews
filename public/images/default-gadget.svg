<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>

  <!-- Decorative grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
  </g>

  <!-- Central Gadget Illustration -->
  <g transform="translate(180, 70)" filter="url(#shadow)">
    <!-- Laptop Base & Screen -->
    <rect x="20" y="20" width="200" height="130" rx="8" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="3"/>
    <rect x="32" y="32" width="176" height="106" rx="4" fill="#0f172a"/>
    <!-- Laptop screen glow -->
    <path d="M 40 40 L 120 40 L 70 130 L 40 130 Z" fill="#38bdf8" fill-opacity="0.12"/>
    <line x1="8" y1="156" x2="232" y2="156" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <polygon points="100,154 140,154 135,158 105,158" fill="#64748b"/>

    <!-- Smartphone overlay -->
    <g transform="translate(160, 60)">
      <rect x="0" y="0" width="55" height="95" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <rect x="5" y="8" width="45" height="75" rx="4" fill="#1e293b"/>
      <circle cx="27" cy="88" r="3" fill="#64748b"/>
      <line x1="20" y1="4" x2="35" y2="4" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Headphones Icon -->
    <g transform="translate(10, 60)">
      <path d="M 0 50 A 25 25 0 0 1 50 50" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
      <rect x="-6" y="44" width="10" height="18" rx="4" fill="#38bdf8"/>
      <rect x="46" y="44" width="10" height="18" rx="4" fill="#38bdf8"/>
    </g>
  </g>

  <!-- Platform Badge & Text -->
  <g transform="translate(300, 290)" text-anchor="middle">
    <rect x="-110" y="0" width="220" height="28" rx="14" fill="#2563eb" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="1">
      UNBIASED TECH RADAR
    </text>
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
      HonneReviews
    </text>
    <text x="0" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">
      Real Buyer Verification &amp; Technical Benchmark
    </text>
  </g>
</svg>
